[package]
name = "ths"
description = "Type checker, type stripper and language server for Typed HaasScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
rowan = "0.17.0"
serde = "1.0.229"
serde_json = "1.0.154"
ths_check = { path = "../ths-check" }
ths_project = { path = "../ths-project" }
ths_strip = { path = "../ths-strip" }
ths_syntax = { path = "../ths-syntax" }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
