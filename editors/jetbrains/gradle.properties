pluginVersion = 0.1.1
# The JetBrains Marketplace channel `./gradlew publishPlugin` publishes to:
# alpha while early users try it; `default` is the stable channel everyone sees.
publishChannel = alpha
# The plugin supports the current stable release line only: it builds against
# that line's latest release, and sinceBuild is the line's branch number. Move
# both forward when a new line ships.
platformVersion = 2026.2.4
sinceBuild = 262
# The newest release the plugin verifier checks it against.
newestVerifiedVersion = 2026.2.4

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
